<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族數位族譜 V3.3 - 影像穩定版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: "Microsoft JhengHei", sans-serif; }
        #status-bar { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #00ff9d; 
            padding: 10px 25px; border-radius: 50px; border: 1px solid #333; 
            font-size: 14px; z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        #canvas { width: 100vw; height: 100vh; cursor: grab; }
        .node circle { stroke: #fff; stroke-width: 2px; transition: stroke 0.3s; cursor: pointer; }
        .node text { fill: #fff; font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px #000; }
        .node.selected circle { stroke: #FF4500; stroke-width: 4px; }
        
        /* 側邊欄與 Tooltip 保留 */
        #sidebar { position: fixed; top: 0; right: -350px; width: 320px; height: 100vh; background: rgba(20,20,20,0.95); border-left: 1px solid #444; transition: 0.4s; z-index: 2000; padding: 20px; color: #eee; }
        #sidebar.active { right: 0; }
        #tooltip { position: absolute; background: rgba(0,0,0,0.8); color: #FFD700; padding: 5px 10px; border-radius: 4px; pointer-events: none; opacity: 0; z-index: 3000; }
        .profile-img { width: 100%; height: 200px; background: #333; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="status-bar"><span id="status-icon">⏳</span><span id="status-text">初始化系統...</span></div>
<div id="tooltip"></div>
<div id="sidebar">
    <button onclick="closeSidebar()" style="float:right; background:none; border:none; color:white; font-size:20px; cursor:pointer;">×</button>
    <img id="sb-photo" class="profile-img" src="">
    <h2 id="sb-name"></h2>
    <p id="sb-rel" style="color:#FFD700; font-weight:bold;"></p>
    <div id="sb-bio"></div>
</div>

<svg id="canvas">
    <defs id="m-defs"></defs>
</svg>

<script>
    // ⚠️ 請務必替換您的 API 網址
    const CSV_URL = '您的網址'; 

    const width = window.innerWidth, height = window.innerHeight;
    let allNodes = [], simulation, currentCenterId = null;

    const svg = d3.select("#canvas").attr("viewBox", [-width/2, -height/2, width, height]);
    const g = svg.append("g");
    const defs = d3.select("#m-defs");

    svg.call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

    async function loadData() {
        try {
            updateStatus("同步雲端資料...");
            const res = await fetch(CSV_URL);
            const data = await res.json();
            
            const nodeMap = new Map();
            data.forEach(d => {
                if(!d.ID) return;
                // 建立頭像 Pattern
                if(d['相片路徑']) {
                    defs.append("pattern")
                        .attr("id", "img-" + d.ID)
                        .attr("width", 1).attr("height", 1)
                        .attr("patternContentUnits", "objectBoundingBox")
                        .append("image")
                        .attr("href", d['相片路徑'])
                        .attr("width", 1).attr("height", 1)
                        .attr("preserveAspectRatio", "xMidYMid slice");
                }

                nodeMap.set(d.ID, {
                    ...d, id: d.ID, name: d['姓名 (中)'],
                    gender: d['性別'], level: 0, children: [], siblings: []
                });
            });

            // 建立關係
            nodeMap.forEach(n => {
                if(n.父親ID && nodeMap.has(n.父親ID)) nodeMap.get(n.父親ID).children.push(n);
                if(n.母親ID && nodeMap.has(n.母親ID)) nodeMap.get(n.母親ID).children.push(n);
            });

            // 計算世代
            for(let i=0; i<8; i++){
                nodeMap.forEach(n => {
                    if(n.父親ID && nodeMap.has(n.父親ID)) n.level = nodeMap.get(n.父親ID).level + 1;
                });
            }

            allNodes = Array.from(nodeMap.values());
            const links = [];
            allNodes.forEach(n => {
                if(n.父親ID && nodeMap.has(n.父親ID)) links.push({source: n.父親ID, target: n.id});
                if(n.母親ID && nodeMap.has(n.母親ID)) links.push({source: n.母親ID, target: n.id});
                if(n.配偶ID && nodeMap.has(n.配偶ID) && n.id < n.配偶ID) links.push({source: n.id, target: n.配偶ID});
            });

            render(allNodes, links);
            updateStatus("系統穩定運行中", "success");
        } catch(e) { updateStatus("連線錯誤: " + e.message, "error"); }
    }

    function render(nodes, links) {
        simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-500))
            .force("y", d3.forceY(d => d.level * 150).strength(0.5))
            .alphaDecay(0.05); // 讓模擬更快安靜下來，避免轉圈圈

        const link = g.append("g").selectAll("line").data(links).join("line").attr("stroke","#444");

        const node = g.append("g").selectAll("g").data(nodes).join("g")
            .attr("class", "node")
            .call(d3.drag().on("start", dragStarted).on("drag", dragged).on("end", dragEnded));

        node.append("circle")
            .attr("r", 30)
            .attr("fill", d => {
                // 如果有照片路徑，使用定義好的 Pattern，否則使用色塊
                return d['相片路徑'] ? `url(#img-${d.id})` : (d.gender === 'F' ? '#F5A623' : '#4A90E2');
            })
            .style("stroke", d => d.gender === 'F' ? '#F5A623' : '#4A90E2');

        node.append("text").attr("dy", 45).attr("text-anchor", "middle").text(d => d.name);

        node.on("click", (e, d) => {
            currentCenterId = d.id;
            d3.selectAll(".node").classed("selected", n => n.id === d.id);
            openSidebar(d);
        });

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
    }

    function updateStatus(t, s) {
        const bar = d3.select("#status-text").text(t);
        d3.select("#status-icon").text(s === "success" ? "✅" : (s === "error" ? "❌" : "⏳"));
    }

    function openSidebar(d) {
        d3.select("#sb-name").text(d.name);
        d3.select("#sb-photo").attr("src", d['相片路徑'] || "");
        d3.select("#sb-bio").text(d['個人簡介'] || "暫無簡介");
        d3.select("#sidebar").classed("active", true);
    }
    function closeSidebar() { d3.select("#sidebar").classed("active", false); }
    function dragStarted(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
    function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragended(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

    loadData();
</script>
</body>
</html>
