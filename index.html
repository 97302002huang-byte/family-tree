<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>家族關係網 - 物理引擎版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: "Microsoft JhengHei"; }
        #canvas { width: 100vw; height: 100vh; }
        .node circle { stroke: #fff; stroke-width: 2px; cursor: grab; }
        .node text { font-size: 12px; fill: #eee; pointer-events: none; text-shadow: 1px 1px 2px #000; }
        .link { stroke: #999; stroke-opacity: 0.6; stroke-width: 2px; }
        #status { position: fixed; top: 10px; left: 10px; color: #0f0; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>

<div id="status">系統準備中...</div>
<div id="canvas"></div>

<script>
const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9UA8RtEJ3d2_Tb9EsIQPeGCf7egp59josXOT4wU3i7fb461XqSqJd4N5ShN89QOt7apY8rStBh4H/pub?output=csv';

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#canvas").append("svg")
    .attr("width", width)
    .attr("height", height)
    .call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)))
    .append("g");

const g = svg.append("g");

const simulation = d3.forceSimulation()
    .force("link", d3.forceLink().id(d => d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-500)) // 排斥力
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide(50)); // 避免重疊

async function init() {
    try {
        document.getElementById("status").innerText = "正在下載 Google Sheets...";
        const resp = await fetch(SPREADSHEET_URL + '&t=' + Date.now());
        const csv = await resp.text();
        const rawData = d3.csvParse(csv);

        document.getElementById("status").innerText = `下載成功，共 ${rawData.length} 人。正在建立物理模型...`;

        // 1. 整理節點 (Nodes)
        const nodes = rawData.filter(d => d.ID).map(d => ({
            id: d.ID.trim(),
            name: d["姓名 (中)"],
            gender: d["性別"]
        }));

        // 2. 整理連線 (Links) - 只要有關係就連，不管輩分
        const links = [];
        const idSet = new Set(nodes.map(n => n.id));

        rawData.forEach(d => {
            const source = d.ID.trim();
            // 處理父母連線
            [d["父親ID"], d["母親ID"]].forEach(target => {
                if (target && idSet.has(target.trim())) {
                    links.push({ source: source, target: target.trim(), type: "parent" });
                }
            });
            // 處理配偶連線
            if (d["配偶ID"] && idSet.has(d["配偶ID"].trim())) {
                // 為了避免重複畫線，我們只畫 "ID 小連到 ID 大" 的
                if (source < d["配偶ID"].trim()) {
                    links.push({ source: source, target: d["配偶ID"].trim(), type: "spouse" });
                }
            }
        });

        render(nodes, links);
        document.getElementById("status").innerText = `渲染完成！節點: ${nodes.length}, 連線: ${links.length}`;

    } catch (e) {
        document.getElementById("status").innerText = "錯誤: " + e;
        document.getElementById("status").style.color = "red";
    }
}

function render(nodes, links) {
    // 繪製連線
    const link = g.append("g")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("class", "link")
        .attr("stroke", d => d.type === 'spouse' ? '#ff69b4' : '#999') // 配偶粉紅線，父母灰線
        .attr("stroke-dasharray", d => d.type === 'spouse' ? '5,5' : '0');

    // 繪製節點
    const node = g.append("g")
        .selectAll(".node")
        .data(nodes)
        .join("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("circle")
        .attr("r", 20)
        .attr("fill", d => d.gender === 'M' ? '#4A90E2' : '#F5A623');

    node.append("text")
        .attr("dy", -30)
        .attr("text-anchor", "middle")
        .text(d => d.name);

    // 啟動物理模擬
    simulation
        .nodes(nodes)
        .on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

    simulation.force("link").links(links);
}

// 拖曳互動函數
function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}
function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
}
function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
}

init();
</script>
</body>
</html>
