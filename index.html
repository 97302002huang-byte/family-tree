<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>互動式數位家族樹 - 完備版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root { --male-color: #4A90E2; --female-color: #F5A623; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8f9fa; margin: 0; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; }
        .node circle { stroke: #fff; stroke-width: 3px; cursor: pointer; transition: 0.3s; }
        .node text { font-size: 14px; font-weight: bold; fill: #333; pointer-events: none; }
        .link { fill: none; stroke: #cbd5e0; stroke-width: 2px; }
        .active-anchor { stroke: #2ecc71 !important; stroke-width: 6px !important; }
        .tooltip { position: absolute; padding: 10px; background: rgba(0,0,0,0.8); color: white; border-radius: 6px; font-size: 13px; display: none; z-index: 1000; }
        .sidebar { position: fixed; right: 0; top: 0; width: 300px; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); padding: 25px; display: none; z-index: 100; overflow-y: auto; }
    </style>
</head>
<body>

<div id="tooltip" class="tooltip"></div>
<div id="canvas"></div>

<div id="sidebar" class="sidebar">
    <button onclick="this.parentElement.style.display='none'" style="float:right">✕</button>
    <div style="text-align:center; margin-top:20px;">
        <img id="sb-photo" style="width:120px; height:120px; border-radius:50%; object-fit:cover; border:3px solid #eee;">
        <h2 id="sb-name"></h2>
    </div>
    <hr>
    <div id="sb-info"></div>
</div>

<script>
const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9UA8RtEJ3d2_Tb9EsIQPeGCf7egp59josXOT4wU3i7fb461XqSqJd4N5ShN89QOt7apY8rStBh4H/pub?output=csv';

let familyData = [];
let anchorMember = null;
const width = window.innerWidth, height = window.innerHeight;

const svg = d3.select("#canvas").append("svg")
    .attr("width", width).attr("height", height)
    .call(d3.zoom().scaleExtent([0.1, 3]).on("zoom", (e) => g.attr("transform", e.transform)))
    .append("g");

const g = svg.append("g").attr("transform", "translate(100, 100)");

async function init() {
    try {
        const resp = await fetch(SPREADSHEET_URL + '&t=' + Date.now());
        const csv = await resp.text();
        const raw = d3.csvParse(csv);
        
        familyData = raw.filter(d => d.ID).map(d => ({
            id: d.ID.trim(),
            name: d["姓名 (中)"],
            gender: d["性別"],
            spouse: d["配偶ID"] ? d["配偶ID"].trim() : null,
            parents: [d["父親ID"], d["母親ID"]].filter(p => p && p.trim() !== "").map(p => p.trim()),
            photo: d["相片路徑"],
            birthday: d["出生日期"],
            bio: d["個人簡介"]
        }));

        anchorMember = familyData[0];
        render();
    } catch (e) { console.error(e); }
}

function render() {
    g.selectAll("*").remove();
    const idMap = new Map(familyData.map(d => [d.id, d]));
    const isSpouse = new Set(familyData.map(d => d.spouse).filter(s => s));

    // 找出所有家族樹的起點 (沒有父母的人，且不只是別人的配偶)
    const roots = familyData.filter(d => d.parents.length === 0 && !isSpouse.has(d.id));
    const effectiveRoots = roots.length > 0 ? roots : [familyData[0]];

    let currentY = 0;

    effectiveRoots.forEach(rootData => {
        // 獲取該分支的所有子孫
        const subset = getSubset(rootData.id, idMap);
        
        try {
            const hierarchy = d3.stratify()
                .id(d => d.id)
                .parentId(d => {
                    const pId = d.parents[0];
                    return idMap.has(pId) ? pId : null;
                })(subset);

            const treeLayout = d3.tree().nodeSize([120, 350]); // 垂直 120, 水平 350
            const rootNode = treeLayout(hierarchy);

            const treeG = g.append("g").attr("transform", `translate(0, ${currentY})`);

            // 畫線
            treeG.selectAll(".link").data(rootNode.links()).join("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

            // 畫人
            const nodes = treeG.selectAll(".node").data(rootNode.descendants()).join("g")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodes.each(function(d) {
                drawNode(d3.select(this), d.data);
                
                // 配偶處理：水平並排 (y+150 左右位置)
                if (d.data.spouse && idMap.has(d.data.spouse)) {
                    const sp = idMap.get(d.data.spouse);
                    const spG = treeG.append("g").attr("transform", `translate(${d.y}, ${d.x + 100})`);
                    drawNode(spG, sp);
                    treeG.append("line")
                        .attr("x1", d.y).attr("y1", d.x + 35).attr("x2", d.y).attr("y2", d.x + 65)
                        .attr("stroke", "#ffb6c1").attr("stroke-width", 2).attr("stroke-dasharray", "4");
                }
            });

            currentY += (rootNode.leaves().length + 1) * 150 + 100;
        } catch (e) { console.warn("分支繪製跳過", e); }
    });
}

function getSubset(rootId, idMap) {
    const res = new Set();
    const stack = [rootId];
    while(stack.length > 0) {
        const id = stack.pop();
        const m = idMap.get(id);
        if (m && !res.has(m)) {
            res.add(m);
            familyData.filter(d => d.parents.includes(id)).forEach(c => stack.push(c.id));
        }
    }
    return Array.from(res);
}

function drawNode(el, m) {
    el.append("circle").attr("r", 35)
        .attr("fill", m.gender === 'M' ? 'var(--male-color)' : 'var(--female-color)')
        .classed("active-anchor", m.id === anchorMember.id)
        .on("click", (e) => { anchorMember = m; render(); showSidebar(m); });
    
    el.append("text").attr("dy", "55px").attr("text-anchor", "middle").text(m.name);
    
    el.on("mouseover", (e) => {
        d3.select("#tooltip").style("display", "block").html(`<strong>${m.name}</strong>`)
            .style("left", (e.pageX+15)+"px").style("top", (e.pageY-10)+"px");
    }).on("mouseout", () => d3.select("#tooltip").style("display", "none"));
}

function showSidebar(m) {
    document.getElementById("sb-photo").src = m.photo || "";
    document.getElementById("sb-name").innerText = m.name;
    document.getElementById("sb-info").innerHTML = `<p>生日: ${m.birthday || '---'}</p><p>簡介: ${m.bio || '---'}</p>`;
    document.getElementById("sidebar").style.display = "block";
}

init();
</script>
</body>
</html>
