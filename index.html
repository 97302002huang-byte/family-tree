<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>家族數位族譜 v7.3</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root { --main-gold: #8b5a2b; --spouse: #e67e22; --active: #3498db; }
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; display: flex; background: #f4f1ea; height: 100vh; overflow: hidden; }
        #tree-container { flex: 1; background: #fcfaf5; cursor: grab; }
        #info-panel { width: 320px; background: white; border-left: 3px solid var(--main-gold); padding: 25px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); overflow-y: auto; }
        .node circle { fill: #fff; stroke: var(--main-gold); stroke-width: 2.5px; transition: 0.2s; cursor: pointer; }
        .node.focused circle { stroke: var(--active); stroke-width: 6px; fill: #ebf5fb; }
        .node text { font-size: 14px; font-weight: bold; fill: #333; pointer-events: none; }
        .link { fill: none; stroke: #d2c4b5; stroke-width: 2px; }
        .marriage-line { stroke: var(--spouse); stroke-width: 3px; stroke-dasharray: 5; }
    </style>
</head>
<body>

<div id="tree-container"></div>
<div id="info-panel">
    <div id="focus-display" style="background:var(--active); color:white; padding:10px; border-radius:5px; text-align:center; margin-bottom:20px; font-weight:bold;">同步中...</div>
    <div id="detail-content"></div>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9UA8RtEJ3d2_Tb9EsIQPeGCf7egp59josXOT4wU3i7fb461XqSqJd4N5ShN89QOt7apY8rStBh4H/pub?output=csv";

    let familyData = [];
    let currentFocus = null;

    const svg = d3.select("#tree-container").append("svg")
        .attr("width", window.innerWidth - 320).attr("height", window.innerHeight)
        .call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));
    const g = svg.append("g");

    d3.csv(CSV_URL).then(data => {
        const row1 = data[0];
        // 欄位對應優化
        const getCol = (names) => Object.keys(row1).find(k => names.some(n => k.replace(/\s+/g, '').includes(n)));
        
        const keys = {
            id: getCol(['ID', 'id']),
            name: getCol(['姓名']),
            gender: getCol(['性別']),
            spouse: getCol(['配偶']),
            father: getCol(['父親']),
            mother: getCol(['母親']),
            photo: getCol(['照片'])
        };

        familyData = data.map(d => {
            const parents = [];
            if (keys.father && d[keys.father]) parents.push(d[keys.father].trim());
            // 注意：D3 Tree 只能處理一個 parent 節點，這裡我們預設取第一個作為階層依據
            return {
                id: d[keys.id] ? d[keys.id].trim() : "",
                name: d[keys.name] ? d[keys.name].trim() : "未命名",
                gender: d[keys.gender] ? d[keys.gender].trim().toUpperCase() : 'M',
                photoId: keys.photo && d[keys.photo] ? d[keys.photo].trim() : '',
                parents: parents,
                isSpouseOf: keys.spouse && d[keys.spouse] ? d[keys.spouse].trim() : null
            };
        }).filter(d => d.id);

        currentFocus = familyData[0];
        document.getElementById('focus-display').innerText = `當前基準點：${currentFocus.name}`;
        render();
        updateUI(currentFocus);
    });

    function getRelation(target, source) {
        if (target.id === source.id) return "本人";
        if (target.isSpouseOf === source.id || source.isSpouseOf === target.id) return (target.gender === 'M' ? "丈夫" : "妻子");
        const sParents = source.parents || [];
        if (sParents.includes(target.id)) return (target.gender === 'M' ? "父親" : "母親");
        if (target.parents.includes(source.id)) return (target.gender === 'M' ? "兒子" : "女兒");
        return "親屬";
    }

    function render() {
        g.selectAll("*").remove();
        
        // 繪圖核心：僅處理血親
        const bloodline = familyData.filter(d => !d.isSpouseOf);
        
        try {
            const root = d3.stratify().id(d => d.id).parentId(d => d.parents[0])(bloodline);
            d3.tree().nodeSize([120, 300])(root);

            g.selectAll(".link").data(root.links()).enter().append("path").attr("class", "link")
             .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

            const nodeGroups = g.selectAll(".node-group").data(root.descendants()).enter().append("g")
                                .attr("transform", d => `translate(${d.y}, ${d.x})`);

            nodeGroups.each(function(d) {
                const el = d3.select(this);
                drawNode(el, d.data, 0);
                const spouse = familyData.find(f => f.isSpouseOf === d.data.id);
                if (spouse) {
                    el.append("line").attr("class", "marriage-line").attr("x1", 0).attr("y1", 45).attr("x2", 0).attr("y2", 75);
                    drawNode(el, spouse, 120);
                }
            });
        } catch (e) {
            console.error("D3 Stratify Error:", e);
        }
    }

    function drawNode(parent, data, yOffset) {
        const n = parent.append("g").attr("class", `node ${data.id === currentFocus.id ? 'focused' : ''}`)
            .attr("transform", `translate(0, ${yOffset})`)
            .on("click", () => { currentFocus = data; document.getElementById('focus-display').innerText = `當前基準點：${data.name}`; render(); updateUI(data); });

        n.append("circle").attr("r", 45);
        n.append("image").attr("xlink:href", `https://drive.google.com/uc?export=view&id=${data.photoId}`)
            .attr("x", -40).attr("y", -40).attr("width", 80).attr("height", 80)
            .attr("clip-path", "circle(40px at 40px 40px)")
            .on("error", function() { d3.select(this).attr("xlink:href", `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name)}&background=8b5a2b&color=fff`); });
        n.append("text").attr("dy", 70).attr("text-anchor", "middle").text(data.name);
    }

    function updateUI(m) {
        const rel = getRelation(m, currentFocus);
        d3.select("#detail-content").html(`
            <div style="text-align:center;">
                <img src="https://drive.google.com/uc?export=view&id=${m.photoId}" style="width:130px; height:130px; border-radius:50%; border:4px solid var(--main-gold);" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=8b5a2b&color=fff'">
                <h2>${m.name}</h2>
                <div style="font-size:1.8em; color:var(--spouse); font-weight:bold;">${rel}</div>
                <hr><p style="color:#999; font-size:0.8em;">點擊頭像可切換視角</p>
            </div>
        `);
    }
</script>
</body>
</html>
