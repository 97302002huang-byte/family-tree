<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族數位族譜 V4.1 - 雙語對接版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root { --primary: #00ff9d; --bg: #1a1a1a; --text: #ffffff; --dim: #aaaaaa; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: sans-serif; }
        
        /* UI 元件樣式 */
        #lang-control { position: fixed; top: 20px; right: 20px; z-index: 1001; }
        .lang-btn { padding: 8px 15px; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        .lang-btn.active { background: var(--primary); color: #000; font-weight: bold; }
        #status-bar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: var(--primary); padding: 8px 20px; border-radius: 20px; z-index: 1000; font-size: 13px; }
        
        /* 畫布與節點 */
        #canvas { width: 100vw; height: 100vh; }
        .link { stroke: #555; stroke-opacity: 0.4; fill: none; }
        .node circle { stroke: #fff; stroke-width: 2px; cursor: pointer; }
        .node.selected circle { stroke: var(--primary); stroke-width: 4px; }
        .main-name { fill: #fff; font-size: 14px; font-weight: bold; text-anchor: middle; }
        .sub-name { fill: var(--dim); font-size: 10px; text-anchor: middle; }

        /* 側邊欄 */
        #sidebar { position: fixed; right: -350px; top: 0; width: 300px; height: 100vh; background: rgba(30,30,30,0.95); padding: 25px; color: white; transition: 0.4s; z-index: 2000; border-left: 1px solid #444; }
        #sidebar.open { right: 0; }
        #tooltip { position: absolute; padding: 10px; background: rgba(0,0,0,0.8); color: white; border-radius: 5px; pointer-events: none; opacity: 0; z-index: 3000; font-size: 12px; }
    </style>
</head>
<body>

    <div id="lang-control">
        <button id="btn-zh" class="lang-btn active" onclick="setLang('ZH')">中文</button>
        <button id="btn-en" class="lang-btn" onclick="setLang('EN')">English</button>
    </div>

    <div id="status-bar"><span id="status-text">初始化中...</span></div>
    <div id="tooltip"></div>

    <div id="sidebar">
        <div onclick="closeSidebar()" style="cursor:pointer; float:right;">✕</div>
        <img id="sb-photo" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
        <h2 id="sb-name"></h2>
        <div id="sb-rel" style="color:var(--primary); margin:10px 0;"></div>
        <p id="sb-bio" style="font-size:14px; color:#ccc;"></p>
    </div>

    <svg id="canvas"></svg>

<script>
    // 已為您填入正確的 SCRIPT_URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4zEnWy42vCiIoaY-tQrdc3OTjoVzi3L3f2nN1Ib2IawXRY9ZC_Aob9AZDrZx8n5Ye/exec";
    
    let currentLang = 'ZH';
    let nodes = [], links = [];
    let svg, g, simulation;

    function setLang(lang) {
        currentLang = lang;
        d3.selectAll(".lang-btn").classed("active", false);
        d3.select(lang === 'ZH' ? "#btn-zh" : "#btn-en").classed("active", true);
        render(); // 語系切換時重新渲染文字
    }

    // 1. 初始化 D3 畫布
    function initChart() {
        svg = d3.select("#canvas");
        g = svg.append("g");
        const zoom = d3.zoom().scaleExtent([0.1, 3]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        simulation = d3.forceSimulation()
            .force("link", d3.forceLink().id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-1000))
            .force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2))
            .force("collision", d3.forceCollide().radius(70));
    }

    // 2. 加載並清洗資料 (核心修復區)
    async function loadData() {
        d3.select("#status-text").text("正在從 Google Cloud 獲取資料...");
        try {
            const response = await fetch(SCRIPT_URL);
            const rawData = await response.json();
            
            // 建立節點 Map 確保 ID 唯一且存在
            const nodeMap = new Map();
            rawData.forEach(d => {
                if (d.ID) nodeMap.set(d.ID.toString().trim(), { ...d, id: d.ID.toString().trim() });
            });

            nodes = Array.from(nodeMap.values());
            links = [];

            // 建立連線並防止 node not found
            nodes.forEach(d => {
                const checkAndAdd = (sid, type) => {
                    if (sid && nodeMap.has(sid.toString().trim())) {
                        links.push({ source: sid.toString().trim(), target: d.id, type: type });
                    }
                };
                checkAndAdd(d['父親ID'], 'blood');
                checkAndAdd(d['母親ID'], 'blood');
                if (d['配偶ID']) {
                    d['配偶ID'].toString().split(',').forEach(sid => {
                        const cleanSid = sid.trim();
                        if (d.id < cleanSid && nodeMap.has(cleanSid)) {
                            links.push({ source: d.id, target: cleanSid, type: 'marriage' });
                        }
                    });
                }
            });

            d3.select("#status-text").text(`連線成功：共 ${nodes.length} 名成員`);
            render();
        } catch (e) {
            console.error(e);
            d3.select("#status-text").text("資料讀取失敗，請檢查 URL 或網路");
        }
    }

    // 3. 稱謂演算法 (BFS + 姑丈擴充)
    function calculateRel(targetId, source) {
        if (targetId === source.id) return { ZH: "本人", EN: "Me" };
        let queue = [{ id: source.id, path: "" }], visited = new Set([source.id]);

        while (queue.length > 0) {
            let curr = queue.shift();
            let p = nodes.find(n => n.id === curr.id);
            if (!p) continue;

            let neighbors = [
                { id: p['父親ID'], r: 'F' }, { id: p['母親ID'], r: 'M' }
            ];
            // 配偶
            if(p['配偶ID']) p['配偶ID'].split(',').forEach(s => neighbors.push({ id: s.trim(), r: 'H' }));
            // 手足
            nodes.filter(n => (n['父親ID']===p['父親ID'] || n['母親ID']===p['母親ID']) && n.id!==p.id && p['父親ID'])
                 .forEach(s => neighbors.push({ id: s.id, r: 'S' }));
            // 子女
            nodes.filter(n => n['父親ID']===p.id || n['母親ID']===p.id).forEach(c => neighbors.push({ id: c.id, r: 'C' }));

            for (let n of neighbors) {
                if (!n.id || visited.has(n.id.toString().trim())) continue;
                let newPath = curr.path + n.r;
                if (n.id.toString().trim() === targetId) return parsePath(newPath, nodes.find(x => x.id === targetId));
                visited.add(n.id.toString().trim());
                queue.push({ id: n.id.toString().trim(), path: newPath });
            }
        }
        return { ZH: "親戚", EN: "Relative" };
    }

    function parsePath(p, target) {
        const isM = target['性別'] === 'M';
        const dict = {
            'F': {ZH:"父親",EN:"Father"}, 'M': {ZH:"母親",EN:"Mother"}, 'S': {ZH:isM?"兄弟":"姊妹",EN:"Sibling"},
            'FS': {ZH:isM?"伯叔":"姑姑",EN:isM?"Uncle":"Aunt"}, 'FSH': {ZH:"姑丈",EN:"Uncle"},
            'SC': {ZH:"堂/表親",EN:"Cousin"}, 'FSC': {ZH:"堂/表親",EN:"Cousin"}
        };
        return dict[p] || { ZH: "親戚", EN: "Relative" };
    }

    // 4. 繪製
    function render() {
        g.selectAll("*").remove();
        const link = g.append("g").selectAll("line").data(links).enter().append("line").attr("class", "link");
        const node = g.append("g").selectAll(".node").data(nodes).enter().append("g")
            .attr("class", d => `node ${d.selected ? 'selected' : ''}`)
            .on("click", (e, d) => selectNode(d))
            .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

        node.append("circle").attr("r", 25).attr("fill", "#444");
        
        node.each(function(d) {
            const el = d3.select(this);
            const zh = d['姓名 (中)'] || "";
            const en = d['姓名 (英)'] || "";
            const main = currentLang === 'ZH' ? zh : (en || zh);
            const sub = currentLang === 'ZH' ? (en ? `(${en})` : "") : (en ? `(${zh})` : "");
            el.append("text").attr("class", "main-name").attr("y", 40).text(main);
            el.append("text").attr("class", "sub-name").attr("y", 54).text(sub);
        });

        simulation.nodes(nodes);
        simulation.force("link").links(links);
        simulation.alpha(1).restart();
        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
    }

    function selectNode(d) {
        nodes.forEach(n => { n.selected = (n.id === d.id); n.tempRel = calculateRel(n.id, d); });
        render();
        d3.select("#sidebar").classed("open", true);
        d3.select("#sb-name").text(currentLang==='ZH' ? d['姓名 (中)'] : (d['姓名 (英)'] || d['姓名 (中)']));
        d3.select("#sb-rel").text((currentLang==='ZH'?'關係：':'Rel: ') + (d.tempRel[currentLang]));
        d3.select("#sb-bio").text(d['個人簡介'] || "");
        d3.select("#sb-photo").attr("src", d['相片路徑'] || "");
    }

    function dragstarted(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
    function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragended(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
    function closeSidebar() { d3.select("#sidebar").classed("open", false); }

    window.onload = () => { initChart(); loadData(); };
</script>
</body>
</html>
