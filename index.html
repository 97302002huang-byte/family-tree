<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>家族族譜 - 強制偵錯版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: #0f0; margin: 20px; }
        #status-monitor { background: #000; border: 1px solid #0f0; padding: 15px; height: 200px; overflow-y: scroll; font-family: monospace; }
        #canvas-container { margin-top: 20px; background: #fff; width: 100%; height: 500px; display: none; }
        .error { color: #f00; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🛠️ 系統後台診斷監視器</h2>
    <div id="status-monitor">正在啟動引擎...</div>

    <div id="canvas-container">
        <svg id="canvas" style="width:100%; height:100%"></svg>
    </div>

<script>
const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9UA8RtEJ3d2_Tb9EsIQPeGCf7egp59josXOT4wU3i7fb461XqSqJd4N5ShN89QOt7apY8rStBh4H/pub?output=csv';

const monitor = document.getElementById("status-monitor");
function log(msg, isError = false) {
    const time = new Date().toLocaleTimeString();
    monitor.innerHTML += `<div class="${isError ? 'error' : ''}">[${time}] ${msg}</div>`;
    monitor.scrollTop = monitor.scrollHeight;
}

async function start() {
    log("開始連接 Google Sheets...");
    
    try {
        // 1. 測試網路連線
        const response = await fetch(SPREADSHEET_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error("網路請求失敗，狀態碼: " + response.status);
        
        log("網路連線成功，正在讀取 CSV 內容...");
        const csvText = await response.text();
        
        if (!csvText || csvText.length < 10) {
            throw new Error("抓到的 CSV 內容為空！請檢查 Google Sheet 是否有資料且已發布。");
        }
        
        log("CSV 內容抓取成功，前 50 字元: " + csvText.substring(0, 50));

        // 2. 解析 CSV
        const data = d3.csvParse(csvText);
        log(`解析完成，共找到 ${data.length} 筆成員資料。`);

        if (data.length > 0) {
            log("欄位名稱偵測: " + Object.keys(data[0]).join(", "));
            
            // 檢查關鍵欄位是否對應
            const requiredFields = ["ID", "姓名 (中)", "性別"];
            requiredFields.forEach(f => {
                if (!(f in data[0])) log(`警告：找不到欄位 [${f}]，請檢查表單標頭！`, true);
            });

            // 啟動主畫面
            document.getElementById("canvas-container").style.display = "block";
            log("正在啟動畫布...");
            drawSimpleTree(data);
        }

    } catch (e) {
        log("❌ 關鍵錯誤: " + e.message, true);
        console.error(e);
    }
}

function drawSimpleTree(rawData) {
    // 這裡跑最簡單的方塊繪製，不跑複雜階層，先求「看得到人」
    const svg = d3.select("#canvas");
    svg.selectAll("*").remove();
    
    const g = svg.append("g").attr("transform", "translate(50,50)");
    
    g.selectAll("rect")
        .data(rawData)
        .enter()
        .append("rect")
        .attr("x", (d, i) => (i % 5) * 150)
        .attr("y", (d, i) => Math.floor(i / 5) * 100)
        .attr("width", 120)
        .attr("height", 60)
        .attr("fill", d => d["性別"] === "M" ? "#4A90E2" : "#F5A623");

    g.selectAll("text")
        .data(rawData)
        .enter()
        .append("text")
        .attr("x", (d, i) => (i % 5) * 150 + 60)
        .attr("y", (d, i) => Math.floor(i / 5) * 100 + 35)
        .attr("text-anchor", "middle")
        .attr("fill", "white")
        .text(d => d["姓名 (中)"]);
    
    log("畫布繪製完成！如果你看到白色區塊內有彩色方塊，代表資料運作正常。");
}

start();
</script>
</body>
</html>
