<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>互動式數位家族樹 - 萬人容錯版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root { --male-color: #4A90E2; --female-color: #F5A623; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; margin: 0; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; background: #f8f9fa; }
        .node circle { stroke: #fff; stroke-width: 3px; cursor: pointer; transition: 0.3s; }
        .node text { font-size: 14px; font-weight: bold; fill: #333; pointer-events: none; }
        .link { fill: none; stroke: #cbd5e0; stroke-width: 2px; }
        .tooltip { 
            position: absolute; padding: 10px; background: rgba(0,0,0,0.8); 
            color: white; border-radius: 6px; font-size: 13px; display: none; z-index: 1000; 
        }
        .sidebar { position: fixed; right: 0; top: 0; width: 300px; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); padding: 20px; display: none; z-index: 100; overflow-y: auto; }
        .active-anchor { stroke: #2ecc71 !important; stroke-width: 6px !important; }
    </style>
</head>
<body>

<div id="loading" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);">資料同步中...</div>
<div id="tooltip" class="tooltip"></div>
<div id="canvas"></div>

<div id="sidebar" class="sidebar">
    <button onclick="this.parentElement.style.display='none'">✕ Close</button>
    <div style="text-align:center; margin-top:20px;">
        <img id="sb-photo" style="width:120px; height:120px; border-radius:50%; object-fit:cover;">
        <h2 id="sb-name"></h2>
    </div>
    <hr>
    <div id="sb-details"></div>
</div>

<script>
const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV9UA8RtEJ3d2_Tb9EsIQPeGCf7egp59josXOT4wU3i7fb461XqSqJd4N5ShN89QOt7apY8rStBh4H/pub?output=csv';

let familyData = [];
let anchorMember = null;
const svg = d3.select("#canvas").append("svg").attr("width", window.innerWidth).attr("height", window.innerHeight);
const g = svg.append("g").attr("transform", "translate(100, 100)");
svg.call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

async function init() {
    const response = await fetch(SPREADSHEET_URL + '&cache=' + new Date().getTime()); // 加時間戳避免快取
    const csvText = await response.text();
    const raw = d3.csvParse(csvText);
    
    familyData = raw.filter(d => d.ID).map(d => ({
        id: d.ID.trim(),
        name: d["姓名 (中)"],
        gender: d["性別"],
        parents: [d["父親ID"], d["母親ID"]].filter(p => p && p.trim() !== ""),
        spouse: d["配偶ID"] ? d["配偶ID"].trim() : null,
        photo: d["相片路徑"],
        birthday: d["出生日期"],
        bio: d["個人簡介"]
    }));

    anchorMember = familyData[0];
    document.getElementById("loading").style.display = "none";
    updateTree();
}

function updateTree() {
    g.selectAll("*").remove();

    // 核心邏輯修正：手動計算佈局而非強迫使用 d3.stratify
    // 為了處理 100 人且可能斷層的資料，我們改用分層渲染
    const idMap = new Map(familyData.map(d => [d.id, d]));
    const spouseIds = new Set(familyData.map(d => d.spouse).filter(id => id));

    // 過濾出主要節點（非配偶）
    const mainNodes = familyData.filter(d => !spouseIds.has(d.id) || d.id === familyData[0].id);
    
    // 建立虛擬分層：根據沒有父母的人作為起始點
    const roots = mainNodes.filter(d => d.parents.length === 0);
    
    let currentY = 0;
    roots.forEach((rootMem, index) => {
        const treeData = buildHierarchy(rootMem, mainNodes);
        if(!treeData) return;
        
        const root = d3.hierarchy(treeData);
        const treeLayout = d3.tree().nodeSize([120, 300]);
        treeLayout(root);

        const treeGroup = g.append("g").attr("transform", `translate(0, ${currentY})`);
        
        // 畫線
        treeGroup.selectAll(".link").data(root.links()).join("path").attr("class", "link")
            .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

        // 畫人
        const nodes = treeGroup.selectAll(".node").data(root.descendants()).join("g")
            .attr("transform", d => `translate(${d.y},${d.x})`);

        nodes.each(function(d) {
            drawMember(d3.select(this), d.data);
            if(d.data.spouse) {
                const sp = idMap.get(d.data.spouse);
                if(sp) {
                    const spG = d3.select(this.parentNode).append("g")
                        .attr("transform", `translate(${d.y}, ${d.x + 100})`);
                    drawMember(spG, sp);
                }
            }
        });
        currentY += 500; // 每個家族分支垂直隔開，避免重疊
    });
}

function buildHierarchy(member, all) {
    const children = all.filter(d => d.parents.includes(member.id));
    return {
        ...member,
        children: children.map(c => buildHierarchy(c, all))
    };
}

function drawMember(el, m) {
    el.append("circle").attr("r", 35)
        .attr("fill", m.gender === 'M' ? 'var(--male-color)' : 'var(--female-color)')
        .classed("active-anchor", m.id === anchorMember.id)
        .on("click", () => { anchorMember = m; updateTree(); showSidebar(m); });
    
    el.append("text").attr("dy", "55px").attr("text-anchor", "middle").text(m.name);
    
    el.on("mouseover", (e) => {
        d3.select("#tooltip").style("display", "block").text(m.name)
            .style("left", (e.pageX+10)+"px").style("top", (e.pageY-10)+"px");
    }).on("mouseout", () => d3.select("#tooltip").style("display", "none"));
}

function showSidebar(m) {
    d3.select("#sb-photo").attr("src", m.photo);
    d3.select("#sb-name").text(m.name);
    d3.select("#sb-details").html(`<p>生日: ${m.birthday}</p><p>簡介: ${m.bio}</p>`);
    d3.select("#sidebar").style("display", "block");
}

init();
</script>
</body>
</html>
