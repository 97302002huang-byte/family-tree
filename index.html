<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>互動式數位家族樹 - 交互增強版</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root { --male-color: #4A90E2; --female-color: #F5A623; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8f9fa; margin: 0; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; }
        .node circle { stroke: #fff; stroke-width: 3px; cursor: pointer; transition: r 0.2s; }
        .node circle:hover { r: 40; }
        .node text { font-size: 14px; font-weight: bold; fill: #333; pointer-events: none; }
        .link { fill: none; stroke: #cbd5e0; stroke-width: 2px; }
        /* 懸浮標籤 */
        .tooltip { 
            position: absolute; padding: 8px 12px; background: rgba(0,0,0,0.8); 
            color: white; border-radius: 6px; font-size: 13px; pointer-events: none; 
            display: none; z-index: 1000; 
        }
        .sidebar { 
            position: fixed; right: 0; top: 0; width: 300px; height: 100%; 
            background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); 
            padding: 20px; display: none; z-index: 100;
        }
        .active-anchor { stroke: #2ecc71 !important; stroke-width: 5px !important; }
    </style>
</head>
<body>

<div id="tooltip" class="tooltip"></div>
<div id="canvas"></div>

<div id="sidebar" class="sidebar">
    <button onclick="this.parentElement.style.display='none'">✕</button>
    <div style="text-align:center">
        <img id="sb-photo" style="width:100px; height:100px; border-radius:50%; object-fit:cover;">
        <h2 id="sb-name"></h2>
        <p><strong>目前的視角基準點</strong></p>
    </div>
    <hr>
    <div id="sb-info"></div>
</div>

<script>
const familyData = [
  { "id": "P001", "name": "黃兆宏", "enName": "---", "gender": "M", "birthday": "1956/01/15", "spouse": "P002", "parents": [], "photo": "https://drive.google.com/uc?export=view&id=1LU64R0LCdVxFyfSgRQLmAtZ-OuL6Zzma" },
  { "id": "P002", "name": "劉水蓮", "enName": "---", "gender": "F", "birthday": "1961/02/02", "spouse": "P001", "parents": [], "photo": "https://drive.google.com/uc?export=view&id=1_CcuhFYkqVL6B-1RHg210ar4vEx60lsU" },
  { "id": "P003", "name": "黃柏文", "enName": "Bruce", "gender": "M", "birthday": "1990/03/19", "spouse": null, "parents": ["P001", "P002"], "photo": "https://drive.google.com/uc?export=view&id=1VAOnXmYMzxNTnVN7eI9_Wd3o1ASEP-6H" },
  { "id": "P004", "name": "黃柏凱", "enName": "Frank", "gender": "M", "birthday": "1991/10/03", "spouse": null, "parents": ["P001", "P002"], "photo": "https://drive.google.com/uc?export=view&id=1i3h7jmxRESk7gP1Qv3vI4ttNdaQLzPx8" }
];

let anchorMember = familyData[0]; // 預設基準點

// 進階稱謂計算
function getRel(target, source) {
    if (target.id === source.id) return "本人";
    if (source.spouse === target.id) return (target.gender==='M'?'丈夫':'妻子');
    if (target.parents.includes(source.id)) return (target.gender==='M'?'兒子':'女兒');
    if (source.parents.includes(target.id)) return (target.gender==='M'?'父親':'母親');
    if (target.parents.length > 0 && JSON.stringify(target.parents) === JSON.stringify(source.parents)) {
        return (target.gender==='M'?'兄弟':'姊妹');
    }
    return "家族成員";
}

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("#canvas").append("svg")
    .attr("width", width).attr("height", height)
    .call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)))
    .append("g");

const g = svg.append("g").attr("transform", "translate(100, 100)");

// 佈局參數優化：增加節點間距
const treeLayout = d3.tree().nodeSize([120, 250]); // [垂直間距, 水平間距]

function updateTree() {
    g.selectAll("*").remove(); // 清除重繪

    // 處理配偶數據，將其放在主節點的 children 之外但位置靠近
    const hierarchyData = d3.stratify()
        .id(d => d.id)
        .parentId(d => d.id === 'P002' ? null : d.parents[0])(familyData.filter(d => d.id !== 'P002'));

    const root = treeLayout(hierarchyData);

    // 畫線
    g.selectAll(".link").data(root.links()).join("path").attr("class", "link")
        .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

    // 畫成員
    const nodes = g.selectAll(".node").data(root.descendants()).join("g")
        .attr("transform", d => `translate(${d.y},${d.x})`);

    renderMember(nodes);

    // 特別處理配偶 P002 (緊貼 P001)
    const p001 = root.find(n => n.id === 'P001');
    if (p001) {
        const spouseG = g.append("g").attr("transform", `translate(${p001.y},${p001.x + 100})`);
        renderMember(spouseG, familyData.find(m => m.id === 'P002'));
        // 畫配偶心連心線
        g.append("line").attr("x1", p001.y).attr("y1", p001.x + 35).attr("x2", p001.y).attr("y2", p001.x + 65)
         .attr("stroke", "#ffb6c1").attr("stroke-width", 3).attr("stroke-dasharray", "4");
    }
}

function renderMember(selection, singleData = null) {
    const enter = singleData ? selection : selection;
    
    const draw = (el, d) => {
        const member = d.data || d;
        const circle = el.append("circle").attr("r", 35)
            .attr("fill", member.gender === 'M' ? '#4A90E2' : '#F5A623')
            .classed("active-anchor", member.id === anchorMember.id)
            .on("click", (e) => {
                anchorMember = member;
                showSidebar(member);
                updateTree();
            })
            .on("mouseover", (e) => {
                const rel = getRel(member, anchorMember);
                d3.select("#tooltip").style("display", "block")
                    .html(`稱呼：<strong>${rel}</strong>`)
                    .style("left", (e.pageX + 15) + "px")
                    .style("top", (e.pageY - 10) + "px");
            })
            .on("mouseout", () => d3.select("#tooltip").style("display", "none"));

        el.append("text").attr("dy", "55px").attr("text-anchor", "middle").text(member.name);
    };

    if (singleData) draw(selection, singleData);
    else selection.each(function(d) { draw(d3.select(this), d); });
}

function showSidebar(m) {
    d3.select("#sb-photo").attr("src", m.photo);
    d3.select("#sb-name").text(m.name);
    d3.select("#sidebar").style("display", "block");
}

updateTree();
window.onresize = () => location.reload();
</script>
</body>
</html>
